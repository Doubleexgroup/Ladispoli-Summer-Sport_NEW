<style>

html,body{
margin:0;
padding:0;
width:100%;
/* height:100dvh usa l'altezza VISIBILE reale (esclude la barra
   indirizzi del browser su mobile). height:100vh resta come
   fallback per i browser che non supportano dvh */
height:100vh;
height:100dvh;
background:#041b45;
font-family:'Montserrat',sans-serif;
overflow:hidden;
}

/* CONTAINER */

.container{
position:relative;
width:100%;
height:100vh;
height:100dvh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

/* WRAPPER POSTER
   Ha le stesse identiche proporzioni della locandina (1024x1536 = 2:3,
   verificato sul file originale). Le due immagini (desktop/mobile)
   vengono messe in position:absolute, sovrapposte esattamente una
   sull'altra (inset:0) dentro questo box: in questo modo, anche se
   per qualche motivo entrambe risultassero visibili, non si sommano
   MAI in altezza (bug che causava la locandina "tagliata in due" su
   mobile, con il fondo dell'immagine in alto e l'inizio in basso).
   overflow:hidden è una sicurezza in più. */
.poster-wrap{
position:relative;
height:96vh;
height:96dvh;
aspect-ratio:1024/1536;
max-width:96%;
max-height:96%;
overflow:hidden;
border-radius:14px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.poster-wrap img{
position:absolute;
inset:0;
display:block;
width:100%;
height:100%;
object-fit:contain;
user-select:none;
pointer-events:none;
}

.poster-desktop{
display:block;
}

.poster-mobile{
display:none;
}
